name: SecureChat CI/CD Pipeline (All Branches)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit Tests
        run: mvn clean verify --batch-mode

      - name: Upload Build Artifacts (Server & Client JAR)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: securechat-build-artifacts
          path: |
            securechat-server/target/*.jar
            securechat-client/target/*.jar

