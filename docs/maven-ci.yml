name: SecureChat Java CI/CD

# 1. Kích hoạt CI khi Push hoặc Pull Request vào nhánh main/master
on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # 2. Chạy trên môi trường Linux mới nhất
    runs-on: ubuntu-latest

    steps:
    # 3. Kéo mã nguồn của bạn từ GitHub về máy chủ ảo
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 4. Cài đặt Java 17 (Chuẩn của đồ án)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Tự động cache các thư viện tải về từ pom.xml để chạy nhanh hơn ở lần sau

    # 5. Cấp quyền thực thi cho Maven wrapper (nếu có dùng mvnw)
    - name: Grant execute permission for mvnw (Optional)
      run: chmod +x mvnw || true

    # 6. Chạy lệnh Build Test cốt lõi
    - name: Build and Package with Maven
      run: mvn -B clean package --file pom.xml

    # 7. (Tương lai) Chạy Unit Test khi bạn tích hợp JUnit
    # - name: Run Unit Tests
    #   run: mvn test